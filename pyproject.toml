[project]
name = "mingjing"
version = "1.0.0.dev2"
description = "MingJing financial research report fact checker"
requires-python = ">=3.12"
license = {text = "AGPL-3.0-only"}
dependencies = ["mcp==2.3.0", "jsonschema>=4.20,<5"]

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.24"]
web = ["streamlit>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
mingjing = "mingjing.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["mingjing", "mingjing.*", "kernel", "kernel.*", "legacy_tools", "legacy_tools.*", "bench", "bench.*", "scripts", "scripts.*"]
exclude = ["vendor*", "frontend*", "runtime*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

